<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Finalize your order of Wakaranai products"
    />
    <link href="../css/style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Kiwi+Maru&family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Momo+Trust+Sans:wght@200..800&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <title>Wakaranai | Checkout</title>
  </head>
  <body>
    <main>
      <section class="section-checkout">
        <h1 class="hidden">
          Checkout page, containing summary, billing info and delivery details
        </h1>
        <article class="checkout-summary">
          <h2 class="checkout-main-heading">Checkout</h2>
          <figure class="summary-table-checkout">
            <h3>Summary</h3>
            <div class="summary-categories-checkout">
              <h4>item</h4>
              <h4 class="text-align-center">quantity</h4>
              <h4 class="text-align-right">price</h4>
            </div>
            <div class="summary-items-checkout">
              <div class="summary-item-checkout">
                <h5>Item name here</h5>
                <p class="text-align-center">qty</p>
                <p class="text-align-right">1234:-</p>
              </div>
            </div>
            <div id="summary-totals-checkout">
              <div class="summary-totals-item-checkout">
                <h5>Item(s)</h5>
                <p>1234:-</p>
              </div>
              <div class="summary-totals-shipping-checkout">
                <h5>Shipping:</h5>
                <p>199:-</p>
              </div>
              <div id="summary-totals-total-checkout">
                <h5>Total:</h5>
                <p>9999:-</p>
              </div>
            </div>
          </figure>
        </article>
        <article class="checkout-form">
          <h2 class="checkout-main-heading-2">Checkout</h2>
          <h3 class="hidden">Delivery address and payment options</h3>
          <form>
            <fieldset class="checkout-form-delivery-address">
              <legend>Delivery Address</legend>

              <label for="first-name-checkout" class="hidden">first name</label>
              <input
                type="text"
                name="first-name-checkout"
                id="first-name-checkout"
                placeholder="First Name*"
                title="Your first name (Minimum of 2 letters. Only letters, use space in place of hyphen in a double name)"
                pattern="[A-Za-z]"
                minlength="2"
                maxlength="30"
                required
              />
              <label for="last-name-checkout" class="hidden">last name</label>
              <input
                type="text"
                name="last-name-checkout"
                id="last-name-checkout"
                placeholder="Last Name*"
                title="Your surname (Minimum of 2 letters. Only letters, use space in place of hyphen in a double name)"
                pattern="[A-Za-z]"
                minlength="2"
                maxlength="40"
                required
              />
              <label for="address-checkout" class="hidden">address</label>
              <input
                type="text"
                name="address-checkout"
                id="address-checkout"
                placeholder="Address*"
                title="the address of your place of residence (Only letters, house number is later)"
                minlength="2"
                maxlength="30"
                pattern="[A-Za-z]"
                required
              />
              <label for="town-city-checkout" class="hidden">town/city</label>
              <input
                type="text"
                name="town-city-checkout"
                id="town-city-checkout"
                placeholder="Town/City*"
                title="your town or city of residence"
                pattern="[A-Za-z]"
                minlength="2"
                maxlength="30"
                required
              />
              <label for="province-checkout" class="hidden">province</label>
              <input
                type="text"
                name="province-checkout"
                id="province-checkout"
                placeholder="Province"
                title="your province of residence"
                pattern="[A-Za-z]"
                minlength="2"
                maxlength="30"
                required
              />
              <label for="house-unit-apt-nr-checkout" class="hidden"
                >house/unit/apt nr</label
              >
              <input
                type="text"
                name="house-unit-apt-nr-checkout"
                id="house-unit-apt-nr-checkout"
                placeholder="House/Unit/Apt nr"
                title="your place of residence's number"
                pattern="[1-9]{1,4}"
                minlength="1"
                maxlength="4"
                required
              />
              <label for="postal-code-checkout" class="hidden"
                >postal code</label
              >
              <input
                type="text"
                name="postal-code-checkout"
                id="postal-code-checkout"
                placeholder="Postal Code*"
                title="your residence's 5-digit postal code"
                pattern="\d{5,5}"
                minlength="5"
                maxlength="5"
                required
              />
            </fieldset>
            <fieldset class="checkout-form-payment-option">
              <legend>Payment Options</legend>

              <div class="payment-option-container">
                <div class="payment-option-div">
                  <div class="payment-input-div">
                    <input
                      type="radio"
                      id="debit-credit-card"
                      name="payment-option"
                      value="debit/credit card"
                    />
                    <label for="debit-credit-card">Debit/Credit Card</label>
                  </div>
                  <div class="payment-options-div">
                    <div class="payment-option-img-container">
                      <img
                        src="../images/mastercard-logo.webp"
                        alt="mastercard logo"
                      />
                    </div>
                    <div
                      class="payment-option-img-container payment-option-amex"
                    >
                      <img
                        src="../images/amex-logo.png"
                        alt="american express logo"
                      />
                    </div>
                    <div class="payment-option-img-container">
                      <img src="../images/visa-logo.webp" alt="visa logo" />
                    </div>
                    <div class="payment-option-img-container">
                      <img
                        src="../images/unionpay-logo.webp"
                        alt="union-pay logo"
                      />
                    </div>
                  </div>
                </div>
                <div class="payment-option-div">
                  <div class="payment-input-div">
                    <input
                      type="radio"
                      id="klarna"
                      name="payment-option"
                      value="klarna"
                    />
                    <label for="klarna">Klarna</label>
                  </div>
                  <div
                    class="payment-option-img-container payment-option-klarna"
                  >
                    <img src="../images/klarna-logo.webp" alt="klarna logo" />
                  </div>
                </div>
                <div class="payment-option-div">
                  <div class="payment-input-div">
                    <input
                      type="radio"
                      id="swish"
                      name="payment-option"
                      value="swish"
                    />
                    <label for="swish">Swish</label>
                  </div>
                  <div class="payment-option-img-container">
                    <img src="../images/swish-logo.png" alt="swish logo" />
                  </div>
                </div>
                <div id="payment-option-bottom" class="payment-option-div">
                  <div class="payment-input-div">
                    <input
                      type="radio"
                      id="paypal"
                      name="payment-option"
                      value="paypal"
                    />
                    <label for="paypal">PayPal</label>
                  </div>
                  <div class="payment-option-img-container">
                    <img src="../images/paypal-logo.png" alt="paypal logo" />
                  </div>
                </div>
              </div>
            </fieldset>
            <label for="checkout-submit" class="hidden">submit-button</label>
            <input
              class="uppercase"
              type="submit"
              id="checkout-submit"
              value="complete purchase"
            />
          </form>
        </article>
      </section>
      <div class="temporary-navigation">
        <a href="../index.html">start</a>
        <a href="../product/index.html">product</a>
        <a href="../cart/index.html">cart</a>
        <a href="../success/index.html">success</a>
        <a href="../account/login.html">login</a>
        <a href="../account/register.html">register</a>
      </div>
    </main>
    <script
      src="https://kit.fontawesome.com/aa8166dc37.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
