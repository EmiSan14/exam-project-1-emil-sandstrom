<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to purchase Wakaranai products" />
    <link href="../css/style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Kiwi+Maru&family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Momo+Trust+Sans:wght@200..800&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <title>Wakaranai | Login</title>
  </head>
  <body class="background-dark">
    <main>
      <section class="login-page background-light">
        <h1>Login</h1>
        <p>
          Enter your account credentials for the ability to shop our products
        </p>
        <form class="form-login">
          <label for="email-login-page" class="hidden">e-mail</label>
          <input
            type="email"
            name="email-login-page"
            id="email-login-page"
            placeholder="E-Mail"
            required
          />
          <label for="password-login-page" class="hidden">e-mail</label>
          <input
            type="password"
            name="password-login-page"
            id="password-login-page"
            placeholder="Password"
            required
          />
          <label for="login-submit" class="hidden">submit</label>
          <input
            type="submit"
            name="login-submit"
            id="login-submit"
            value="log in"
          />
          <p>
            Don't already have an account? Sign up
            <a href="register.html">here</a>
          </p>
        </form>
      </section>
      <div class="temporary-navigation">
        <a href="../index.html">start</a>
        <a href="../product/index.html">product</a>
        <a href="../checkout/index.html">checkout</a>
        <a href="../success/index.html">success</a>
        <a href="register.html">register</a>
      </div>
    </main>
    <script
      src="https://kit.fontawesome.com/aa8166dc37.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
