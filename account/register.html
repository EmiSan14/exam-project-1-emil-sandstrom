<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to purchase Wakaranai products" />
    <link href="../css/style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&family=Kiwi+Maru&family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Momo+Trust+Sans:wght@200..800&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <title>Wakaranai | Login</title>
  </head>
  <body class="background-dark">
    <main class="main-register">
      <div class="spinner hidden"></div>
      <div class="error-message-div hidden">
        <p>Something went wrong. Try again later.</p>
        <button class="error-message-button">ok</button>
      </div>
      <div class="register-toast-div hidden">
        <p class="text-align-center">Account successfully registered!</p>
      </div>
      <section class="register-page background-light">
        <h1 class="text-align-center">Register</h1>
        <p class="text-align-center">
          Sign up to be able to shop from our products and get notified about
          upcoming collections and deals
        </p>
        <form class="form-register">
          <label for="username-register-page" class="hidden">e-mail</label>
          <input
            type="text"
            name="username-register-page"
            id="username-register-page"
            placeholder="Username"
            title="Username including at least 1 uppercase letter, 1 lowercase letter, and 1 number"
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
            required
          />
          <label for="email-register-page" class="hidden">e-mail</label>
          <input
            type="email"
            name="email-register-page"
            id="email-register-page"
            placeholder="E-Mail"
            title="Valid @stud.noroff.no email-address"
            pattern=".*@stud.noroff.no"
            required
          />
          <label for="password-register-page" class="hidden">password</label>
          <input
            type="password"
            name="password-register-page"
            id="password-register-page"
            placeholder="Password"
            title="Valid password requires at least 1 uppercase letter, 1 lowercase letter, and 1 number"
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
            required
          />
          <label for="password-register-page-repeat" class="hidden"
            >repeat password</label
          >
          <input
            type="password"
            name="password-register-page-repeat"
            id="password-register-page-repeat"
            placeholder="Repeat Password"
            title="Repeat password above"
            required
          />
          <div class="register-checkbox-div">
            <input
              type="checkbox"
              name="checkbox-tos-and-pp"
              id="checkbox-tos-and-pp"
              required
            />
            <label for="checkbox-tos-and-pp"
              >I agree to the <a href="">Terms of Service</a> and
              <a href="">Privacy Policy</a>*</label
            >
          </div>
          <div class="register-checkbox-div">
            <input
              type="checkbox"
              name="checkbox-offers-and-news"
              id="checkbox-offers-and-news"
              title="You will receive emails from us to your saved email-address"
            />
            <label for="checkbox-offers-and-news"
              >I want to receive information about offers and news</label
            >
          </div>
          <label for="register-submit" class="hidden">register-button</label>
          <input
            type="submit"
            name="register-submit"
            class="uppercase"
            id="register-submit"
            value="register"
          />
          <p class="text-align-center" id="reg-to-log-text">
            Already have an account? Log in
            <a href="login.html">here</a>
          </p>
        </form>
      </section>
      <div class="temporary-navigation">
        <a href="../index.html">start</a>
        <a href="../product/index.html">product</a>
        <a href="../cart/index.html">cart</a>
        <a href="../checkout/index.html">checkout</a>
        <a href="../success/index.html">success</a>
        <a href="../account/login.html">login</a>
      </div>
    </main>
    <script src="../js/register.js" type="module"></script>
    <script
      src="https://kit.fontawesome.com/aa8166dc37.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
